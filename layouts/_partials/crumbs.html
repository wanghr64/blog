{{ if not .IsHome }}
<div class="crumbs">
  <nav class="crumbs-inner" aria-label="面包屑">
    <a href="{{ site.Home.RelPermalink }}">首页</a>
    {{ range .Ancestors.Reverse }}
      {{ if not .IsHome }}<span class="sep">›</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}
    {{ end }}
    <span class="sep">›</span><span>{{ .Title }}</span>
  </nav>
</div>
{{ end }}
