<header class="bar">
  <div class="bar-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="tabs" aria-label="主导航">
      <a class="tab{{ if .IsHome }} current{{ end }}" href="{{ site.Home.RelPermalink }}">首页</a>
      {{ range site.Menus.main }}
        {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <a class="tab{{ if $active }} current{{ end }}" href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
