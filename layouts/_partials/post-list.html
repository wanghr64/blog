{{ if . }}
<div class="cards">
  {{ range . }}
  <article class="card">
    <h2 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ with .Params.summary | default .Description }}<p class="card-sum">{{ . }}</p>{{ end }}
    <div class="card-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <span class="sep">·</span>
      <span>{{ .ReadingTime }} 分钟</span>
      {{ with .GetTerms "tags" }}
      <span class="card-tags">{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</span>
      {{ end }}
    </div>
  </article>
  {{ end }}
</div>
{{ else }}
<p class="empty">还没有文章。</p>
{{ end }}
